name: discover-artist

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission UUID to discover
        required: true
        type: string
      deployment_target:
        description: Secrets target for this dispatch
        required: false
        default: development
        type: choice
        options:
          - development
          - production
      youtube_network_mode:
        description: Route YouTube traffic directly or through WARP
        required: false
        default: warp
        type: choice
        options:
          - warp
          - direct
      warp_image:
        description: Docker image used for WARP proxy mode
        required: false
        default: monius/docker-warp-socks:v4
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_DIRECT: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_DATABASE_URL_DIRECT' || 'DEVELOPMENT_DATABASE_URL_DIRECT'] }}
      APP_BASE_URL: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_APP_BASE_URL' || 'DEVELOPMENT_APP_BASE_URL'] }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'INTERNAL_WORKER_SHARED_SECRET' || 'DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET'] }}
      WORKER_DEPLOYMENT_TARGET: ${{ (github.event.inputs.deployment_target == 'production') && 'production' || 'development' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-listened-preview.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ !(github.event.inputs.deployment_target == 'production') && format('https://github.com/{0}', github.repository_owner) || '' }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check callback isolation
        run: python3 -m worker.callbacks --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify yt-dlp JS runtime
        run: |
          deno --version
          python - <<'PY'
          import shutil

          print(f"deno={shutil.which('deno') or 'missing'}")
          print(f"node={shutil.which('node') or 'missing'}")
          PY

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare YouTube auth
        if: ${{ github.event.inputs.deployment_target == 'production' }}
        id: youtube_auth
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_USER_AGENT: ${{ secrets.YOUTUBE_USER_AGENT }}
        run: ./.github/scripts/prepare-youtube-auth.sh

      - name: Start WARP proxy
        id: warp_proxy
        if: ${{ github.event.inputs.youtube_network_mode == 'warp' }}
        run: |
          set -euo pipefail

          docker rm -f set-list-warp >/dev/null 2>&1 || true
          docker pull "${WARP_IMAGE}"
          docker run \
            --detach \
            --name set-list-warp \
            --publish 127.0.0.1:9091:9091 \
            "${WARP_IMAGE}"

          for delay in 2 4 8 16 32 32 32; do
            if curl -fsSx socks5h://127.0.0.1:9091 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "WARP proxy is healthy."
              exit 0
            fi

            echo "WARP proxy is still starting; waiting ${delay}s."
            sleep "${delay}"
          done

          docker logs set-list-warp || true
          echo "WARP proxy did not become healthy."
          exit 1
        env:
          WARP_IMAGE: ${{ github.event.inputs.warp_image || 'monius/docker-warp-socks:v4' }}

      - name: Configure YouTube network mode
        run: |
          if [[ "${YOUTUBE_NETWORK_MODE}" == "warp" ]]; then
            echo "Using WARP proxy for yt-dlp traffic."
          else
            echo "Using direct runner egress for yt-dlp traffic."
          fi
        env:
          YOUTUBE_NETWORK_MODE: ${{ github.event.inputs.youtube_network_mode }}

      - name: Run discovery job
        env:
          HTTPS_PROXY: ${{ github.event.inputs.youtube_network_mode == 'warp' && 'socks5h://127.0.0.1:9091' || '' }}
        run: python -m worker.jobs.discover_artist --submission-id "${{ github.event.inputs.submission_id }}"

      - name: Persist refreshed YouTube cookies
        if: ${{ success() && github.event.inputs.deployment_target == 'production' && steps.youtube_auth.outputs.cookies_present == 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: ./.github/scripts/persist-youtube-cookies.sh

      - name: Finalize discovery workflow
        if: ${{ always() }}
        run: |
          python3 -m worker.callbacks /api/internal/finalize-discovery <<'JSON'
          {
            "submissionId": "${{ github.event.inputs.submission_id }}",
            "workflowRunId": "${{ github.run_id }}",
            "workflowResult": "${{ job.status }}"
          }
          JSON

      - name: Stop WARP proxy
        if: ${{ always() && github.event.inputs.youtube_network_mode == 'warp' }}
        run: docker rm -f set-list-warp >/dev/null 2>&1 || true
