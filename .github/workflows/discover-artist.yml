name: discover-artist

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission UUID to discover
        required: true
        type: string
      deployment_target:
        description: Secrets target for this dispatch
        required: false
        default: development
        type: choice
        options:
          - development
          - production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_DIRECT: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_DATABASE_URL_DIRECT || secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_APP_BASE_URL || secrets.DEVELOPMENT_APP_BASE_URL }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets.INTERNAL_WORKER_SHARED_SECRET }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
    services:
      warp:
        image: ghcr.io/mon-ius/docker-warp-socks:v5
        ports:
          - 9091:9091
        options: >-
          --health-cmd "curl -fsSx socks5h://127.0.0.1:9091 https://cloudflare.com/cdn-cgi/trace | grep -q warp=on"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [[ -n "${YOUTUBE_COOKIES_B64}" ]]; then
            echo "${YOUTUBE_COOKIES_B64}" | base64 -d > /tmp/yt-cookies.txt
            echo "YTDLP_COOKIE_FILE=/tmp/yt-cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run discovery job
        env:
          HTTPS_PROXY: socks5h://localhost:9091
        run: python -m worker.jobs.discover_artist --submission-id "${{ github.event.inputs.submission_id }}"
