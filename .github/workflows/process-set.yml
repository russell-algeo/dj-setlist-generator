name: process-set

on:
  workflow_dispatch:
    inputs:
      set_run_id:
        description: Set run UUID to process
        required: true
        type: string
      private_analysis:
        description: Fixed private analysis only; requires a precreated private development run
        required: false
        default: false
        type: boolean
      private_enrichment_only:
        description: Metadata only for completed fixed private development run
        required: false
        default: false
        type: boolean
      private_enrichment_expected:
        description: Reviewed identity and source/cluster/publication pins JSON; no source links
        required: false
        type: string
      dispatch_generation:
        description: Non-secret attempt fence assigned by the application dispatcher
        required: false
        type: string
      resume_mode:
        description: Whether to run the full pipeline or only the publish/finalize tail
        required: false
        default: full
        type: choice
        options:
          - full
          - publish_only
          - private_queue
      deployment_target:
        description: Secrets target for this dispatch
        required: false
        default: development
        type: choice
        options:
          - development
          - production
      recognition_slot_count:
        description: Number of recognition slots to fan out across, or auto
        required: false
        default: "auto"
        type: string
      lease_size:
        description: Number of segments bundled into each lease, or auto
        required: false
        default: "auto"
        type: string
      private_queue_once:
        description: Run one private queue tick with at most one new child and no rollover
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event.inputs.resume_mode == 'private_queue' && 'process-set-private-queue-preview' || github.event.inputs.private_analysis == 'true' && format('process-set-private-analysis-{0}', github.event.inputs.set_run_id) || format('process-set-{0}-{1}-{2}', github.ref, github.event.inputs.deployment_target, github.event.inputs.set_run_id) }}
  cancel-in-progress: ${{ github.event.inputs.private_analysis != 'true' }}

env:
  SET_LIST_DISPATCH_GENERATION: ${{ github.event.inputs.dispatch_generation }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (github.event.inputs.private_analysis != 'true' && github.event.inputs.resume_mode != 'publish_only' ) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      slot_matrix: ${{ steps.scheduler.outputs.slot_matrix }}
      effective_slot_count: ${{ steps.scheduler.outputs.effective_slot_count }}
      effective_lease_size: ${{ steps.scheduler.outputs.effective_lease_size }}
    env:
      DATABASE_URL_DIRECT: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_DATABASE_URL_DIRECT' || 'DEVELOPMENT_DATABASE_URL_DIRECT'] }}
      APP_BASE_URL: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_APP_BASE_URL' || 'DEVELOPMENT_APP_BASE_URL'] }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'INTERNAL_WORKER_SHARED_SECRET' || 'DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET'] }}
      WORKER_DEPLOYMENT_TARGET: ${{ (github.event.inputs.deployment_target == 'production') && 'production' || 'development' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-git-preview-russell-algeos-projects.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ !(github.event.inputs.deployment_target == 'production') && format('https://github.com/{0}', github.repository_owner) || '' }}
      ENABLE_CHECKPOINTS: "false"
      FFMPEG_PORTABLE_DIR: ".runtime/ffmpeg"
      CONCURRENT_RECOGNITIONS: "2"
      RECOGNITION_SLOT_COUNT_REQUESTED: ${{ github.event.inputs.recognition_slot_count }}
      LEASE_SIZE_REQUESTED: ${{ github.event.inputs.lease_size }}
      BATCH_SIZE: "10"
      QUOTA_COOLDOWN_DURATION: "60"
    steps:
      - uses: actions/checkout@v4

      - name: Check callback isolation
        run: python3 -m worker.callbacks --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-bootstrap.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify yt-dlp JS runtime
        run: |
          deno --version
          python - <<'PY'
          import shutil

          print(f"deno={shutil.which('deno') or 'missing'}")
          print(f"node={shutil.which('node') or 'missing'}")
          PY

      - name: Ensure ffmpeg
        run: ./.github/scripts/ensure-ffmpeg.sh

      - name: Install Python dependencies
        run: python -m pip install -r requirements-bootstrap.txt

      - name: Prepare YouTube auth
        # Share the existing session only with the permanent repository Preview bootstrap.
        # Cookie persistence and GH_PAT remain production-only below.
        if: ${{ github.event.inputs.deployment_target == 'production' || (github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' && github.event.inputs.deployment_target == 'development') }}
        id: youtube_auth
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_USER_AGENT: ${{ secrets.YOUTUBE_USER_AGENT }}
        run: ./.github/scripts/prepare-youtube-auth.sh

      - name: Bootstrap set run
        run: python -m worker.jobs.process_set --phase bootstrap --set-run-id "${{ github.event.inputs.set_run_id }}"

      - name: Persist refreshed YouTube cookies
        if: ${{ success() && github.event.inputs.deployment_target == 'production' && steps.youtube_auth.outputs.cookies_present == 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: ./.github/scripts/persist-youtube-cookies.sh

      - id: scheduler
        name: Emit scheduler outputs
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from psycopg import connect
          from psycopg.rows import dict_row

          with connect(os.environ["DATABASE_URL_DIRECT"], autocommit=True, row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute(
                  """
                  select
                    source_metadata->>'recognition_slot_count' as recognition_slot_count,
                    source_metadata->>'lease_size' as lease_size
                  from ops.set_runs
                  where id = %s
                  """,
                  (os.environ["SET_RUN_ID"],),
              )
              row = cur.fetchone()

          if not row:
              raise SystemExit("Failed to load scheduler outputs from ops.set_runs")

          slot_count = max(1, int(row["recognition_slot_count"]))
          lease_size = max(1, int(row["lease_size"]))
          print(f"effective_slot_count={slot_count}")
          print(f"effective_lease_size={lease_size}")
          print(f"slot_matrix={json.dumps(list(range(slot_count)))}")
          PY
        env:
          SET_RUN_ID: ${{ github.event.inputs.set_run_id }}

      - name: Upload prepared audio
        uses: actions/upload-artifact@v4
        with:
          name: set-runtime-${{ github.event.inputs.set_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            assets
            .runtime/ffmpeg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  recognize:
    needs:
      - bootstrap
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (github.event.inputs.private_analysis != 'true' && github.event.inputs.resume_mode != 'publish_only' ) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot_index: ${{ fromJSON(needs.bootstrap.outputs.slot_matrix) }}
    env:
      DATABASE_URL_DIRECT: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_DATABASE_URL_DIRECT' || 'DEVELOPMENT_DATABASE_URL_DIRECT'] }}
      APP_BASE_URL: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_APP_BASE_URL' || 'DEVELOPMENT_APP_BASE_URL'] }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'INTERNAL_WORKER_SHARED_SECRET' || 'DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET'] }}
      WORKER_DEPLOYMENT_TARGET: ${{ (github.event.inputs.deployment_target == 'production') && 'production' || 'development' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-git-preview-russell-algeos-projects.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ !(github.event.inputs.deployment_target == 'production') && format('https://github.com/{0}', github.repository_owner) || '' }}
      ENABLE_CHECKPOINTS: "false"
      FFMPEG_PORTABLE_DIR: ".runtime/ffmpeg"
      CONCURRENT_RECOGNITIONS: "2"
      RECOGNITION_SLOT_COUNT: ${{ needs.bootstrap.outputs.effective_slot_count }}
      LEASE_SIZE: ${{ needs.bootstrap.outputs.effective_lease_size }}
      BATCH_SIZE: "10"
      QUOTA_COOLDOWN_DURATION: "60"
    steps:
      - uses: actions/checkout@v4

      - name: Check callback isolation
        run: python3 -m worker.callbacks --check

      - name: Download prepared runtime
        uses: actions/download-artifact@v4
        with:
          name: set-runtime-${{ github.event.inputs.set_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-recognize.txt

      - name: Ensure ffmpeg
        run: ./.github/scripts/ensure-ffmpeg.sh

      - name: Install Python dependencies
        run: python -m pip install -r requirements-recognize.txt

      - name: Recognize lease slot
        run: python -m worker.jobs.process_set --phase recognize --set-run-id "${{ github.event.inputs.set_run_id }}" --slot-index "${{ matrix.slot_index }}"

  publish:
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (always() && github.event.inputs.private_analysis != 'true' && (github.event.inputs.resume_mode == 'publish_only' || needs.bootstrap.result == 'success') ) ) }}
    needs:
      - bootstrap
      - recognize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL_DIRECT: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_DATABASE_URL_DIRECT' || 'DEVELOPMENT_DATABASE_URL_DIRECT'] }}
      APP_BASE_URL: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_APP_BASE_URL' || 'DEVELOPMENT_APP_BASE_URL'] }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'INTERNAL_WORKER_SHARED_SECRET' || 'DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET'] }}
      WORKER_DEPLOYMENT_TARGET: ${{ (github.event.inputs.deployment_target == 'production') && 'production' || 'development' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-git-preview-russell-algeos-projects.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ !(github.event.inputs.deployment_target == 'production') && format('https://github.com/{0}', github.repository_owner) || '' }}
      SET_LIST_ACTIVE_SET_RUN_ID: ${{ github.event.inputs.set_run_id }}
      SET_LIST_RESUME_MODE: ${{ github.event.inputs.resume_mode }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
      DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
      ENABLE_DISCOGS: "true"
      ENABLE_CHECKPOINTS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Check callback isolation
        run: python3 -m worker.callbacks --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-publish.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-publish.txt

      - name: Publish set run
        run: python -m worker.jobs.process_set --phase publish --set-run-id "${{ github.event.inputs.set_run_id }}"

  finalize:
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (always() && github.event.inputs.private_analysis != 'true' ) ) }}
    needs:
      - bootstrap
      - recognize
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_BASE_URL: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'PRODUCTION_APP_BASE_URL' || 'DEVELOPMENT_APP_BASE_URL'] }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets[(github.event.inputs.deployment_target == 'production') && 'INTERNAL_WORKER_SHARED_SECRET' || 'DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET'] }}
      WORKER_DEPLOYMENT_TARGET: ${{ (github.event.inputs.deployment_target == 'production') && 'production' || 'development' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-git-preview-russell-algeos-projects.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ !(github.event.inputs.deployment_target == 'production') && format('https://github.com/{0}', github.repository_owner) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Finalize run and dispatch next work
        run: |
          python3 -m worker.callbacks /api/internal/finalize-set-run <<'JSON'
          {
            "setRunId": "${{ github.event.inputs.set_run_id }}",
            "workflowRunId": "${{ github.run_id }}",
            "bootstrapResult": "${{ needs.bootstrap.result }}",
            "recognizeResult": "${{ needs.recognize.result }}",
            "publishResult": "${{ needs.publish.result }}"
          }
          JSON

  private-offline-tests:
    # No environment, DB/provider secrets, source input, or artifacts in this job.
    if: ${{ github.event.inputs.private_enrichment_only != 'true' && (github.event.inputs.private_analysis == 'true' && github.event.inputs.deployment_target == 'development' && github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Exercise ambient fencing through the entire offline pipeline without
      # inheriting the real dispatch identity. Runtime jobs keep the real value.
      SET_LIST_DISPATCH_GENERATION: '00000000-0000-4000-8000-000000000001'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-private-recognize.txt
      - name: Run synthetic Python regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/test-recognition-offline.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic PostgreSQL and migration regressions
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/private-tests" @electric-sql/pglite@0.5.15 drizzle-orm@0.45.1 tsx@4.21.0
          export PGLITE_PACKAGE_ROOT="$RUNNER_TEMP/private-tests/node_modules/@electric-sql/pglite"
          export NODE_PATH="$RUNNER_TEMP/private-tests/node_modules"
          export PYTHON="$(command -v python)"
          node scripts/test-yoon-resume-pglite.mjs
          node scripts/test-yoon-owner-projection-pglite.mjs
          node scripts/test-yoon-passive-guard-pglite.mjs
          node scripts/test-yoon-queue-pglite.mjs
          node scripts/test-yoon-egress-projection-pglite.mjs
          node scripts/test-yoon-windows-projection-pglite.mjs
          node scripts/test-yoon-queue-enqueue-pglite.mjs
          node --import "$RUNNER_TEMP/private-tests/node_modules/tsx/dist/loader.mjs" scripts/test-yoon-queue-dispatch-pglite.ts
          node scripts/test-private-migration-stages.mjs
          node scripts/test-yoon-registry-migration-stage.mjs
          node scripts/test-yoon-registry-acl-pglite.mjs
          node scripts/test-yoon-version-registry-pglite.mjs
          node scripts/test-yoon-version-sources-pglite.mjs
  private-prepare:
    outputs:
      complete: ${{ steps.private_prepare.outputs.complete }}
      slot_matrix: ${{ steps.private_prepare.outputs.slot_matrix }}
      effective_slot_count: ${{ steps.private_prepare.outputs.effective_slot_count }}
    needs: private-offline-tests
    # Publish on a reviewed, protected ref before dispatch; never execute PR code.
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (github.event.inputs.private_analysis == 'true' && github.event.inputs.deployment_target == 'development' && github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' ) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PRIVATE_RUN_ID: ${{ github.event.inputs.set_run_id }}
      WORKER_DEPLOYMENT_TARGET: development
      ENABLE_CHECKPOINTS: 'false'
      SEGMENT_DURATION: '30'
      SEGMENT_OVERLAP: '15'
      CONCURRENT_RECOGNITIONS: '2'
      BATCH_SIZE: '10'
      QUOTA_COOLDOWN_DURATION: '60'
      ENABLE_SPOTIFY: 'false'
      ENABLE_YOUTUBE: 'false'
      ENABLE_DISCOGS: 'false'
      ENABLE_SPOTIFY_PLAYLISTS: 'false'
      NTFY_TOPIC: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./.github/scripts/ensure-ffmpeg.sh
      - run: python -m pip install -r requirements-private-recognize.txt
      - name: Prepare fixed input
        id: private_prepare
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
        run: python -m worker.jobs.yoon_recognition_diagnostics prepare
      - uses: actions/upload-artifact@v4
        if: ${{ steps.private_prepare.outputs.complete != 'true' }}
        with:
          name: analysis-audio-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixed-analysis/audio/input.mp3
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
      - if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/fixed-analysis"
  private-recognize:
    needs: private-prepare
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (needs.private-prepare.outputs.complete != 'true' ) ) }}
    strategy:
      fail-fast: false
      matrix:
        slot_index: ${{ fromJson(needs.private-prepare.outputs.slot_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PRIVATE_RUN_ID: ${{ github.event.inputs.set_run_id }}
      PRIVATE_SLOT_INDEX: ${{ matrix.slot_index }}
      PRIVATE_SLOT_COUNT: ${{ needs.private-prepare.outputs.effective_slot_count }}
      WORKER_DEPLOYMENT_TARGET: development
      ENABLE_CHECKPOINTS: 'false'
      SEGMENT_DURATION: '30'
      SEGMENT_OVERLAP: '15'
      CONCURRENT_RECOGNITIONS: '2'
      BATCH_SIZE: '10'
      QUOTA_COOLDOWN_DURATION: '60'
      ENABLE_SPOTIFY: 'false'
      ENABLE_YOUTUBE: 'false'
      ENABLE_DISCOGS: 'false'
      ENABLE_SPOTIFY_PLAYLISTS: 'false'
      NTFY_TOPIC: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./.github/scripts/ensure-ffmpeg.sh
      - run: python -m pip install -r requirements-private-recognize.txt
      - uses: actions/download-artifact@v4
        with:
          name: analysis-audio-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixed-analysis/audio
      - name: Recognize fixed input privately
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
        run: python -m worker.jobs.yoon_recognition_diagnostics recognize
      # No result/log/checkpoint artifact, cache, summary or publish/finalize callback.
      - if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/fixed-analysis"

  private-release:
    # Private-only owner cleanup. Never invokes the normal finalizer or dispatcher.
    needs: [private-offline-tests, private-prepare, private-recognize]
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only != 'true' && (always() && needs.private-offline-tests.result == 'success' && github.event.inputs.private_analysis == 'true' && github.event.inputs.deployment_target == 'development' && github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' ) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_RUN_ID: ${{ github.event.inputs.set_run_id }}
      WORKER_DEPLOYMENT_TARGET: development
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-base.txt
      - name: Release only the private continuation owner
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
        run: python -m worker.jobs.yoon_recognition_diagnostics release

  private-enrichment:
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only == 'true' && github.event.inputs.private_analysis == 'true' && github.event.inputs.deployment_target == 'development' && github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' && fromJSON(github.event.inputs.private_enrichment_expected || '{}').rich_metadata != true ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-publish.txt
      - name: Enrich completed private run with Spotify only
        env:
          WORKER_DEPLOYMENT_TARGET: development
          PRIVATE_RUN_ID: ${{ github.event.inputs.set_run_id }}
          PRIVATE_ENRICHMENT_EXPECTED: ${{ github.event.inputs.private_enrichment_expected }}
          DATABASE_URL_DIRECT: ${{ secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m worker.jobs.yoon_spotify_enrich >/dev/null 2>&1

  private-production-metadata:
    if: ${{ github.event.inputs.resume_mode != 'private_queue' && (github.event.inputs.private_enrichment_only == 'true' && github.event.inputs.private_analysis == 'true' && github.event.inputs.deployment_target == 'development' && github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' && fromJSON(github.event.inputs.private_enrichment_expected || '{}').rich_metadata == true ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-publish.txt
      - name: Test private metadata guards without credentials
        run: python -m unittest discover -s tests -p test_yoon_metadata_enrich.py
      - name: Enrich and stage the completed private set
        env:
          WORKER_DEPLOYMENT_TARGET: development
          PRIVATE_RUN_ID: ${{ github.event.inputs.set_run_id }}
          PRIVATE_ENRICHMENT_EXPECTED: ${{ github.event.inputs.private_enrichment_expected }}
          DATABASE_URL_DIRECT: ${{ secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m worker.jobs.yoon_metadata_enrich

  private-queue:
    needs: private-offline-tests
    # Existing workflow route, Preview only. No new workflow registration or grants.
    if: ${{ github.event.inputs.resume_mode == 'private_queue' && github.event.inputs.private_analysis == 'true' && github.event.inputs.private_enrichment_only != 'true' && github.event.inputs.deployment_target == 'development' && github.repository == 'russell-algeo/dj-setlist-generator' && github.ref == 'refs/heads/preview' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      WORKER_DEPLOYMENT_TARGET: development
      PRIVATE_QUEUE_ONCE: ${{ github.event.inputs.private_queue_once || 'false' }}
      WORKER_EXPECTED_PREVIEW_ORIGIN: https://dj-setlist-generator-git-preview-russell-algeos-projects.vercel.app
      WORKER_VERCEL_OIDC_AUDIENCE: ${{ format('https://github.com/{0}', github.repository_owner) }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-base.txt
      - name: Consume reviewed private queue at existing bounded capacity
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
          APP_BASE_URL: ${{ secrets.DEVELOPMENT_APP_BASE_URL }}
          INTERNAL_WORKER_SHARED_SECRET: ${{ secrets.DEVELOPMENT_INTERNAL_WORKER_SHARED_SECRET }}
        run: python -m worker.jobs.yoon_queue
