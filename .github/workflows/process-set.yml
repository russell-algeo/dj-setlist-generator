name: process-set

on:
  workflow_dispatch:
    inputs:
      set_run_id:
        description: Set run UUID to process
        required: true
        type: string
      deployment_target:
        description: Secrets target for this dispatch
        required: false
        default: development
        type: choice
        options:
          - development
          - production
      recognition_slot_count:
        description: Number of recognition slots to fan out across
        required: false
        default: "10"
        type: string
      lease_size:
        description: Number of segments bundled into each lease
        required: false
        default: "10"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slot_matrix: ${{ steps.build.outputs.slot_matrix }}
    steps:
      - id: build
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          slot_count = max(1, int(os.environ["RECOGNITION_SLOT_COUNT_INPUT"]))
          print(f"slot_matrix={json.dumps(list(range(slot_count)))}")
          PY
        env:
          RECOGNITION_SLOT_COUNT_INPUT: ${{ github.event.inputs.recognition_slot_count }}

  bootstrap:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL_DIRECT: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_DATABASE_URL_DIRECT || secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_APP_BASE_URL || secrets.DEVELOPMENT_APP_BASE_URL }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets.INTERNAL_WORKER_SHARED_SECRET }}
      ENABLE_CHECKPOINTS: "false"
      CONCURRENT_RECOGNITIONS: "2"
      RECOGNITION_SLOT_COUNT: ${{ github.event.inputs.recognition_slot_count }}
      LEASE_SIZE: ${{ github.event.inputs.lease_size }}
      BATCH_SIZE: "10"
      QUOTA_COOLDOWN_DURATION: "60"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap set run
        run: python -m worker.jobs.process_set --phase bootstrap --set-run-id "${{ github.event.inputs.set_run_id }}"

      - name: Upload prepared audio
        uses: actions/upload-artifact@v4
        with:
          name: set-assets-${{ github.event.inputs.set_run_id }}
          path: assets
          if-no-files-found: error
          retention-days: 1

  recognize:
    needs:
      - plan
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot_index: ${{ fromJSON(needs.plan.outputs.slot_matrix) }}
    env:
      DATABASE_URL_DIRECT: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_DATABASE_URL_DIRECT || secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_APP_BASE_URL || secrets.DEVELOPMENT_APP_BASE_URL }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets.INTERNAL_WORKER_SHARED_SECRET }}
      ENABLE_CHECKPOINTS: "false"
      CONCURRENT_RECOGNITIONS: "2"
      RECOGNITION_SLOT_COUNT: ${{ github.event.inputs.recognition_slot_count }}
      LEASE_SIZE: ${{ github.event.inputs.lease_size }}
      BATCH_SIZE: "10"
      QUOTA_COOLDOWN_DURATION: "60"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download prepared audio
        uses: actions/download-artifact@v4
        with:
          name: set-assets-${{ github.event.inputs.set_run_id }}
          path: assets

      - name: Recognize lease slot
        run: python -m worker.jobs.process_set --phase recognize --set-run-id "${{ github.event.inputs.set_run_id }}" --slot-index "${{ matrix.slot_index }}"

  publish:
    if: ${{ always() && needs.bootstrap.result == 'success' && needs.recognize.result == 'success' }}
    needs:
      - bootstrap
      - recognize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL_DIRECT: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_DATABASE_URL_DIRECT || secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_APP_BASE_URL || secrets.DEVELOPMENT_APP_BASE_URL }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets.INTERNAL_WORKER_SHARED_SECRET }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
      DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
      ENABLE_DISCOGS: "true"
      ENABLE_CHECKPOINTS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Publish set run
        run: python -m worker.jobs.process_set --phase publish --set-run-id "${{ github.event.inputs.set_run_id }}"

  finalize:
    if: ${{ always() }}
    needs:
      - bootstrap
      - recognize
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_DIRECT: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_DATABASE_URL_DIRECT || secrets.DEVELOPMENT_DATABASE_URL_DIRECT }}
      APP_BASE_URL: ${{ github.event.inputs.deployment_target == 'production' && secrets.PRODUCTION_APP_BASE_URL || secrets.DEVELOPMENT_APP_BASE_URL }}
      INTERNAL_WORKER_SHARED_SECRET: ${{ secrets.INTERNAL_WORKER_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Finalize run and dispatch next work
        run: |
          python -m worker.jobs.process_set \
            --phase finalize \
            --set-run-id "${{ github.event.inputs.set_run_id }}" \
            --bootstrap-result "${{ needs.bootstrap.result }}" \
            --recognize-result "${{ needs.recognize.result }}" \
            --publish-result "${{ needs.publish.result }}"
