name: checks

# Fast, credential-free checks for every PR. Mirrors the local checks listed in
# DEPLOYMENT.md ("Checklist: validate a new Preview candidate"). The Next.js
# production build is not repeated here: it needs database configuration at
# page-data collection, and Vercel already builds every pushed branch.

on:
  pull_request:
    branches:
      - preview
      - remote-deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests

  web:
    name: Web tests, types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter web test
      - name: Type check
        run: pnpm --filter web exec tsc --noEmit
      - name: Lint
        run: pnpm --filter web lint

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # Matches DEPLOYMENT.md: external shellcheck/pyflakes are not part of the baseline.
          ./actionlint -color -shellcheck= -pyflakes=

  diff:
    name: Whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No PR base; skipping."
            exit 0
          fi
          git diff --check "$BASE_SHA"...HEAD
